# pyproject.toml

[project]
name = "knowsearch"
version = "0.1.0"
description = "A minimal MCP server for web search and content extraction"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "ddgs>=9.16.1",
    "fastapi>=0.162.0",
    "fastmcp>=4.2.0",
    "httpx>=0.28.1",
    "markdown>=3.11.2",
    "ollama>=0.6.3",
    "openai>=3.42.1",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.33",
    "qdrant-client>=1.20.0",
    "tenacity>=9.2.1",
    "tiktoken>=0.14.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
